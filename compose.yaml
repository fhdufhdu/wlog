services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wlog
      POSTGRES_USER: wlog
      POSTGRES_PASSWORD: wlog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wlog-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wlog -d wlog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wlog-postgres:

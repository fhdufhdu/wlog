{% extends "base.html" %}
{% block content %}
<main id="main" class="article-shell" tabindex="-1">
  <article class="article-view">
    <header class="article-header">
      <p class="article-kicker">{{ post.topic }}</p>
      <h1>{{ post.title }}</h1>
      <p><time datetime="{{ published_iso }}">{{ post.date }}</time><span>마지막 수정 <time datetime="{{ updated_iso }}">{{ updated_iso }}</time></span></p>
    </header>
    <div class="prose markdown-body">{{ body_html|safe }}</div>
    <nav class="article-nav" aria-label="글 이동"><a href="/">글 목록</a></nav>
  </article>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="/mermaid.js"></script><script type="module" src="/math.js"></script>{% endblock %}

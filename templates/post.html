{{template "public-head" .}}<main id="main" class="article-shell" tabindex="-1"><article class="article-view"><header class="article-header"><p class="article-kicker">{{.Post.Topic}}</p><h1>{{.Post.Title}}</h1><p><time datetime="{{.PublishedISO}}">{{.Post.Date}}</time><span>마지막 수정 <time datetime="{{.UpdatedISO}}">{{.UpdatedDisplay}}</time></span></p></header><div class="prose markdown-body">{{safeHTML .BodyHTML}}</div><nav class="article-nav" aria-label="글 이동">{{if .Previous}}<a class="article-nav-post article-nav-previous" href="/posts/{{.Previous.Slug}}{{.NavigationQuery}}"><span>이전글</span><strong>{{.Previous.Title}}</strong></a>{{else}}<span class="article-nav-empty" aria-disabled="true">이전글</span>{{end}}<a class="article-nav-list" href="{{.ListURL}}">글 목록</a>{{if .Next}}<a class="article-nav-post article-nav-next" href="/posts/{{.Next.Slug}}{{.NavigationQuery}}"><span>다음글</span><strong>{{.Next.Title}}</strong></a>{{else}}<span class="article-nav-empty article-nav-empty-next" aria-disabled="true">다음글</span>{{end}}</nav></article></main><script type="module" src="/mermaid.js"></script><script type="module" src="/math.js"></script>{{template "public-foot" .}}

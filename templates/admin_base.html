<!doctype html>
<html lang="ko-KR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f2f4f7">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>{{ page_title }} — {{ site_name }}</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-body {% block body_class %}{% endblock %}">
  <header class="admin-header">
    <a class="site-title" href="/admin">{{ site_name }} 관리</a>
    <nav>{% block admin_nav %}{% endblock %}{% include "theme_toggle.html" %}</nav>
  </header>
  {% block admin_content %}{% endblock %}
  <dialog id="operation-dialog" class="operation-dialog" aria-labelledby="operation-title" aria-describedby="operation-detail">
    <div class="operation-progress" aria-hidden="true"><span></span></div>
    <h2 id="operation-title">처리 중입니다</h2>
    <p id="operation-detail" aria-live="polite">잠시만 기다려주세요.</p>
  </dialog>
  {% block admin_scripts %}{% endblock %}
</body>
</html>

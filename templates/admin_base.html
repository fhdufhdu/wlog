{{define "admin-head"}}<!doctype html><html lang="ko-KR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f2f4f7"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>{{.PageTitle}} — {{.SiteName}}</title><script src="/theme.js"></script><link rel="stylesheet" href="/styles.css"></head><body class="admin-body {{with .BodyClass}}{{.}}{{end}}"><header class="admin-header"><a class="site-title" href="/admin">{{.SiteName}} 관리</a><nav><a href="/">블로그 보기</a>{{end}}

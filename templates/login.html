<!doctype html><html lang="ko-KR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 로그인 — {{ site_name }}</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><main class="login-shell"><a class="site-title" href="/">{{ site_name }}</a><section class="login-panel"><h1>관리자 로그인</h1><p>글을 작성하고 관리하려면 로그인하세요.</p>{% if error != "" %}<p class="form-alert" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/admin/login"><div class="field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button-primary" type="submit">로그인</button></form></section></main></body></html>

{{template "admin-head" .}}
<a href="/admin">글 목록</a>
<a href="/about">소개 보기</a>
{{template "admin-nav-end" .}}

<main class="editor-shell">
  <form id="editor-form" class="editor-form" method="post" action="/admin/about" data-preview-url="/admin/markdown-preview">
    <input type="hidden" name="csrf_token" id="csrf-token" value="{{.CSRF}}">
    <div class="editor-mobile-tabs" role="tablist" aria-label="편집 화면">
      <button id="write-tab" class="editor-tab is-current" type="button" role="tab" aria-selected="true" aria-controls="write-panel">작성</button>
      <button id="preview-tab" class="editor-tab" type="button" role="tab" aria-selected="false" aria-controls="preview-panel">미리보기</button>
    </div>

    <div class="editor-workspace">
      <section id="write-panel" class="editor-pane editor-write-pane" role="tabpanel" aria-labelledby="write-tab">
        <div class="editor-pane-inner">
          <label class="sr-only" for="title">소개 제목</label>
          <input id="title" class="editor-title-input" name="title" value="{{.Title}}" maxlength="120" placeholder="소개" required>
          <div class="editor-title-rule" aria-hidden="true"></div>
          {{template "toolbar" .}}
          <label class="sr-only" for="content_markdown">소개 본문 · Markdown</label>
          <textarea id="content_markdown" name="content_markdown" class="markdown-editor" rows="24" placeholder="Markdown으로 소개를 작성하세요.">{{.ContentMarkdown}}</textarea>
        </div>
      </section>

      <section id="preview-panel" class="editor-pane editor-preview-pane" role="tabpanel" aria-labelledby="preview-tab" aria-live="polite">
        <article class="editor-preview-document">
          <h1 id="preview-title" class="editor-preview-title">{{.Title}}</h1>
          <div id="preview-body" class="markdown-body prose">
            <p class="preview-empty">본문을 입력하면 여기에 미리보기가 표시됩니다.</p>
          </div>
        </article>
      </section>
    </div>

    <footer class="editor-actions">
      <a class="editor-exit" href="/admin">나가기</a>
      <p id="save-status" class="editor-save-status" role="status">저장된 소개입니다</p>
      <div class="editor-action-buttons">
        <button class="button-primary" type="submit" data-loading-title="소개를 저장하고 있습니다" data-loading-detail="작성한 내용을 반영하고 있습니다.">저장</button>
      </div>
    </footer>
  </form>
</main>
<script type="module" src="/mermaid.js"></script>
<script type="module" src="/math.js"></script>
<script type="module" src="/admin.js"></script>
{{template "admin-foot" .}}

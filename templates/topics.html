{{template "admin-head" .}}
<a href="/admin">글 관리</a><a href="/admin/about">소개 작성</a><a href="/admin/posts/new" class="button-primary">새 글</a>
<form method="post" action="/admin/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button type="submit">로그아웃</button></form>
{{template "admin-nav-end" .}}
<main class="admin-main topic-admin">
  <header class="page-heading"><h1>주제 관리</h1><p>{{len .Topics}}개</p></header>
  <form method="post" action="/admin/topics"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label for="topic-name">새 주제</label><input id="topic-name" name="name" maxlength="40" required><button class="button-primary" type="submit">추가</button></form>
  {{if .Topics}}<div class="admin-posts">{{range .Topics}}<article>
    <form method="post" action="/admin/topics/{{.ID}}"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><input name="name" value="{{.Name}}" maxlength="40" required><span>{{.PostCount}}개의 글 · {{.TempCount}}개의 임시글</span><button type="submit">수정</button></form>
    {{if not .InUse}}<form method="post" action="/admin/topics/{{.ID}}/delete"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button class="danger-button" type="submit">제거</button></form>{{end}}
  </article>{{end}}</div>{{else}}<p class="empty-state">아직 주제가 없습니다.</p>{{end}}
</main>
{{template "admin-foot" .}}

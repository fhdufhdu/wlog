{{template "admin-head" .}}<a href="/admin/topics">주제 관리</a><a href="/admin/about">소개 작성</a><a href="/admin/posts/new" class="button-primary">새 글</a><form method="post" action="/admin/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button type="submit">로그아웃</button></form>{{template "admin-nav-end" .}}<main class="admin-main"><header class="page-heading"><h1>글 관리</h1><p>{{len .Posts}}편</p></header>{{if .Posts}}<div class="admin-posts">{{range .Posts}}<article><div><span class="status-mark">{{.Status}}</span><h2><a href="{{.EditURL}}">{{.Title}}</a></h2><p>{{if .Slug}}/posts/{{.Slug}} · {{end}}{{.Updated}}</p></div><form method="post" action="{{.DeleteURL}}" onsubmit="return confirm('이 글을 제거할까요? 이 작업은 되돌릴 수 없습니다.')"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button class="danger-button" type="submit">제거</button></form></article>{{end}}</div>{{else}}<p class="empty-state">아직 글이 없습니다. 첫 글을 작성해보세요.</p>{{end}}</main>{{template "admin-foot" .}}
